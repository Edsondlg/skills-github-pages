[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "troquel-nx"
version = "0.1.0"
description = "Diseño de carcasas de troquel (die sets) con texto: Claude + Python + MCP + Siemens NX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
troquel = "troquel.cli:main"
troquel-mcp = "troquel.mcp_server:main"

[tool.setuptools]
packages = ["troquel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
