<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoMetría 3D · Piezas estampadas</title>
<meta name="description" content="Sistema de fotogrametría en el navegador para reconstruir piezas estampadas en 3D con precisión milimétrica: patrones de calibración, fotos, calibración de cámara, reconstrucción densa en GPU, visor 3D, mediciones, comparación con CAD y reporte de calidad.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111820'/%3E%3Cpath d='M14 44 L32 14 L50 44 Z' fill='none' stroke='%232dd4bf' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='35' r='6' fill='%232dd4bf'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 64 64" class="brand-logo" aria-hidden="true"><path d="M14 44 L32 14 L50 44 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="35" r="6" fill="currentColor"/></svg>
    <div>
      <div class="brand-name">FotoMetría 3D</div>
      <div class="brand-sub">Reconstrucción fotogramétrica de piezas estampadas</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btn-demo" title="Genera fotos sintéticas de una pieza y ejecuta el flujo">▶ Demo</button>
    <button class="btn ghost" id="btn-guide">Guía de captura</button>
    <button class="btn ghost icon" id="btn-theme" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
  </div>
</header>

<div class="main">
  <nav class="rail" id="rail" aria-label="Pasos">
    <button class="step" data-step="patterns"><span class="num">1</span><span class="lbl">Patrones</span><span class="dot"></span></button>
    <button class="step" data-step="photos"><span class="num">2</span><span class="lbl">Fotos</span><span class="dot"></span></button>
    <button class="step" data-step="calib"><span class="num">3</span><span class="lbl">Calibración</span><span class="dot"></span></button>
    <button class="step" data-step="recon"><span class="num">4</span><span class="lbl">Reconstruir</span><span class="dot"></span></button>
    <button class="step" data-step="viewer"><span class="num">5</span><span class="lbl">Visor 3D</span><span class="dot"></span></button>
    <button class="step" data-step="results"><span class="num">6</span><span class="lbl">Resultados</span><span class="dot"></span></button>
    <button class="step" data-step="cad"><span class="num">7</span><span class="lbl">Comparar CAD</span><span class="dot"></span></button>
  </nav>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <section class="stage" id="stage">
    <div class="view" id="view-pattern" hidden></div>
    <div class="view" id="view-photos" hidden></div>
    <div class="view" id="view-3d" hidden>
      <div id="viewer-host" class="viewer-host"></div>
      <div class="hud hud-top" id="hud-top"></div>
      <div class="hud hud-legend" id="hud-legend" hidden></div>
      <div class="hud hud-info" id="hud-info"></div>
    </div>
    <div class="view" id="view-dash" hidden></div>
  </section>
</div>

<footer class="statusbar">
  <div id="status-msg" class="status-msg">Listo.</div>
  <div class="progress" id="progress" hidden><div class="bar" id="progress-bar"></div></div>
  <div id="status-right" class="status-right"></div>
</footer>

<div class="toasts" id="toasts"></div>
<dialog id="modal" class="modal"><div class="modal-body" id="modal-body"></div></dialog>

<noscript><p class="noscript">Esta aplicación necesita JavaScript habilitado.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
