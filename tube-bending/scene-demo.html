<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena 3D — demo</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.3 system-ui, sans-serif; color: #1d2026; background: #e6e8eb; }
  #view { position: absolute; inset: 0 0 92px 0; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 6px 10px; background: #f6f7f8; border-top: 1px solid #c9cdd2; display: flex; flex-direction: column; gap: 5px; }
  #bar .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #bar button { font: inherit; padding: 2px 8px; border: 1px solid #b7bcc3; border-radius: 4px; background: #fff; cursor: pointer; }
  #bar button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #bar .sep { width: 1px; height: 18px; background: #c9cdd2; margin: 0 4px; }
  #time { flex: 1; min-width: 200px; }
  #info { font-variant-numeric: tabular-nums; min-width: 320px; }
  #legend { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,0.9); border: 1px solid #c9cdd2; border-radius: 6px; padding: 6px 8px; display: none; }
  #legend .sw { display: inline-block; width: 14px; height: 10px; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(0,0,0,.2); }
</style>
</head>
<body>
<div id="view"></div>
<div id="legend"></div>
<div id="bar">
  <div class="row">
    <button type="button" id="play">▶ Reproducir</button>
    <input type="range" id="time" min="0" max="1" step="0.01" value="0">
    <span id="info">Cargando…</span>
  </div>
  <div class="row" id="controls"></div>
</div>
<script type="module" src="js/dev/scene-demo.js"></script>
</body>
</html>
