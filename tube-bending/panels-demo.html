<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paneles de resultados — demo</title>
<!-- Google Fonts: se omite en navegadores automatizados (la captura bloquea el dominio y el fallo de
     carga sería un error de consola); en uso normal carga Barlow / Barlow Semi Condensed / JetBrains Mono. -->
<script>
  if (!navigator.webdriver) {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap';
    document.head.append(l);
  }
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/panels.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
  .demo-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
  .demo-bar select, .demo-bar button { font: inherit; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 3px 6px; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 420px)); gap: 10px; padding: 10px; align-items: start; }
  .demo-col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-width: 0; }
  .demo-col > h2 { margin: 0 0 8px; font-family: var(--font-cond); font-size: var(--fs-lg); font-weight: 600; }
</style>
</head>
<body>
<div class="demo-bar">
  <label>Pieza <select id="demo-sample"></select></label>
  <label>Material <select id="demo-material"></select></label>
  <button type="button" id="demo-theme">Tema claro/oscuro</button>
</div>
<main class="demo-grid" id="demo-grid"></main>
<script type="module" src="js/dev/panels-demo.js"></script>
</body>
</html>
